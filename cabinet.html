<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FeraPhone — личный кабинет</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="header"><div class="container nav"><a class="logo" href="index.html">Fera<span>Phone</span></a><nav class="nav-links"><a href="index.html">Телефоны</a><a class="active" href="cabinet.html">Избранное</a><a id="adminLink" class="hidden" href="admin.html">Админ-панель</a></nav><div class="nav-actions"><span id="userName" class="user-name"></span><a id="authLink" class="btn btn-outline" href="auth.html">Войти</a><button id="logoutBtn" class="btn btn-dark hidden">Выйти</button></div></div></header>
<main class="section"><div class="container"><div class="section-head"><div><p class="eyebrow">Личный кабинет</p><h1 id="welcome">Мои телефоны</h1></div></div><div class="profile-grid"><section class="panel"><h2>Профиль</h2><form id="profileForm"><label>Имя<input id="profileName" required></label><label>Email<input id="profileEmail" disabled></label><button class="btn btn-primary" type="submit">Сохранить профиль</button><p id="profileMsg" class="form-message"></p></form></section><section class="panel"><h2>Статистика</h2><div class="stats"><div><b id="savedCount">0</b><span>в избранном</span></div><div><b id="reviewCount">0</b><span>оценок</span></div></div></section></div><section class="panel"><div class="panel-head"><h2>Избранные телефоны</h2><span class="muted">обновляется в реальном времени</span></div><div id="savedGrid" class="cards-grid"></div><div id="savedEmpty" class="empty hidden"><div>♡</div><h3>Пока пусто</h3><p>Открой телефон и добавь его в избранное.</p></div></section><section class="panel"><div class="panel-head"><h2>История действий</h2></div><div id="historyList" class="history-list"></div></section></div></main><footer class="footer"><div class="container">FeraPhone</div></footer>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script><script src="js/cabinet.js"></script></body></html>
